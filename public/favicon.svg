<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="64" height="64" rx="14" fill="#020617"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Orbital ellipse ring -->
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-dasharray="3 2" transform="rotate(-28 32 32)"/>

  <!-- Outer aura glow -->
  <circle cx="32" cy="32" r="18" fill="url(#starGlow)"/>

  <!-- 4-point Diamond Star -->
  <path d="M 32 15 Q 32 32 49 32 Q 32 32 32 49 Q 32 32 15 32 Q 32 32 32 15 Z" fill="#f8fafc"/>
  <!-- Central bright core -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>

  <!-- Satellite orbit node -->
  <circle cx="48" cy="22" r="2.2" fill="#38bdf8"/>
</svg>
